name: Import videos

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-videos.yml"

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download seeded MP4s
        run: |
          set -euo pipefail
          mkdir -p public/videos
          BASE="https://temporary-speedy-coral-nfa0qq2.vercel.app/videos"
          for f in antikythera cologne portrait projector saturn-v steam-engine technic-expo walking-robot; do
            echo "fetch $f"
            curl -fL --retry 4 --retry-delay 2 "$BASE/$f.mp4" -o "public/videos/$f.mp4"
            test -s "public/videos/$f.mp4"
          done
          ls -la public/videos
      - name: Commit videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos
          if git diff --cached --quiet; then
            echo "no video changes"
          else
            git commit -m "Add public/videos clips"
            git push
          fi
